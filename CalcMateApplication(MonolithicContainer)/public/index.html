<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Primary Meta Tags -->
    <meta charset="utf-8" />
    <title>CalcMate – Calculus Problem Solver and Learning Tool</title>
    <meta name="description" content="CalcMate is a user-friendly, web-based calculator designed for students to solve limits, derivatives, and integrals with step-by-step LaTeX explanations. Educational, accessible, and mobile-ready." />
    <meta name="keywords" content="calculus, calculus calculator, limit, derivative, integral, math, education, LaTeX, KaTeX, MathJax, step-by-step, student, learning, problem solver, mathematics, responsive, React" />
    <meta name="author" content="CalcMate" />

    <!-- Mobile & SEO -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#304ffe" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Social -->
    <meta property="og:title" content="CalcMate – Calculus Problem Solver" />
    <meta property="og:description" content="Interactive educational tool for limits, derivatives, and integrals with LaTeX math output." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="favicon.ico" />
    <meta property="og:site_name" content="CalcMate" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="CalcMate – Calculus Problem Solver" />
    <meta name="twitter:description" content="Solve calculus problems step-by-step with LaTeX rendering. Perfect for students and learners." />
    <meta name="twitter:image" content="favicon.ico" />

    <!-- Favicon and Manifest -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- (Optional) Place your app logo here -->
    <!-- <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" /> -->
    <!-- <link rel="manifest" href="manifest.json" /> -->

    <!-- KaTeX/MathJax: LaTeX rendering support (KaTeX preferred by CRA apps) -->
    <!-- KaTeX (pre-installed via npm), styles (included here for SSR/fallback/render) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-kWPLU+gIQslQDb4cIBP9Wy9RIGFRmnxpcm0LF0NfrtYVYe+dtT4z/K5UA0UbwbiR" crossorigin="anonymous">

    <!-- (Optional) MathJax support if needed in future
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
    -->

    <!-- Accessibility & progressive enhancement -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <noscript>
      <strong>CalcMate requires JavaScript to function. Please enable JavaScript in your browser for the best experience.</strong>
    </noscript>
    <header>
      <nav aria-label="Main navigation">
        <!-- App banner can be React-rendered for true SPA; nothing here by default -->
      </nav>
    </header>

    <main id="main-content" tabindex="-1" aria-label="CalcMate Calculus Solver Main Content" role="main">
      <!-- Required by Create React App: root div for mounting React -->
      <div id="root"></div>
    </main>

    <footer>
      <!-- Footer content is rendered by React -->
    </footer>
  </body>
</html>
